# tmux defaults for the AIDA agent container.
# Detach with Ctrl-b d: Claude keeps running, `aida run` re-attaches.

set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:RGB:extkeys"
set -s extended-keys on
# Claude Code uses Esc to interrupt — don't make tmux wait for a meta sequence.
set -sg escape-time 10

set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour203,bold] AIDA #[default]"
set -g status-left-length 20
set -g status-right "#[fg=colour244]Ctrl-b d: detach "
set -g window-status-current-format "#[fg=colour81,bold] #W "
