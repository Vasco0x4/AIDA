# =============================================================================
# AIDA — ISOLATED DEV STACK
# Parallel, self-contained development instance. Runs alongside the main
# (production) AIDA stack without conflicts: distinct container names, ports,
# volume, and networks. Nothing here touches the aida_* main stack.
#
#   Postgres : 127.0.0.1:5433   (main uses 5432)
#   Backend  : 127.0.0.1:8001   (main uses 8000)
#   Frontend : 127.0.0.1:5174   (main uses 5173)
#
# Bring up:  docker compose -f docker-compose.yml up -d
# =============================================================================
name: aida-dev

services:
  # PostgreSQL Database (dev — separate volume, starts empty)
  postgres:
    image: postgres:16-alpine
    container_name: aida_dev_postgres
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aida}
      POSTGRES_DB: ${POSTGRES_DB:-aida_assessments}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_DEV:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aida-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aida} -d ${POSTGRES_DB:-aida_assessments}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend (dev — hot reload)
  backend:
    image: vasco0x4/aida-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # pytest + ruff baked into the dev image (scripts/test.sh runs inside it)
        INSTALL_DEV: "true"
    container_name: aida_dev_backend
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: ${DB_HOST:-postgres}
      POSTGRES_DB: ${DB_NAME:-aida_assessments}
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:8001:8000"
    volumes:
      - ./backend:/app:z
      - /app/venv
      - ./backend/logs:/app/logs:z
      # Offensive-security skill base (read-only) — loaded into the knowledge
      # layer and read on demand by the agent's read_skill tool.
      - ./skills:/skills:ro
      # Evidence mirror: PoC videos / screenshots / submission reports are also
      # written to disk here (host: ./evidence) as convenient files, in addition
      # to the DB copy. Container path /evidence == host ~/AIDA-dev/evidence.
      - ./evidence:/evidence:z
    networks:
      - aida-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (dev) — Vite dev server with HOT RELOAD, built from the
  # repo's dev Dockerfile (node + `npm run dev`). Source is bind-mounted so UI
  # edits reflect live. The browser talks to the Vite server's /api proxy
  # (VITE_API_URL=/api), which forwards to the in-container backend service —
  # works from localhost and from LAN IPs alike, no CORS involved. UI at
  # http://localhost:5174.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aida-dev-frontend:dev
    container_name: aida_dev_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_MCP_PORT: ${VITE_MCP_PORT:-8001}
      VITE_MCP_URL: ${VITE_MCP_URL:-}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:5174:5173"
    volumes:
      - ./frontend:/app:z
      - aida_dev_frontend_modules:/app/node_modules
    networks:
      - aida-dev-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Docker Socket Proxy — filtered Docker API for the dev backend
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aida_dev_docker_proxy
    restart: unless-stopped
    environment:
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      BUILD: 0
      AUTH: 0
      SECRETS: 0
      PLUGINS: 0
      INFO: 0
      VERSION: 0
      EVENTS: 0
      DISTRIBUTION: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aida-dev-network

  # AIDA Pentest execution container (dev — separate workspaces dir)
  aida-pentest:
    image: vasco0x4/aida-pentest:latest
    build:
      context: ./pentest
      dockerfile: Dockerfile
    container_name: aida-dev-pentest
    tty: true
    stdin_open: true
    volumes:
      - ${HOME}/.aida-dev/workspaces:/workspace
    networks:
      - aida-dev-pentest-network
    restart: unless-stopped

networks:
  aida-dev-network:
    name: aida-dev-network
    driver: bridge
  aida-dev-pentest-network:
    name: aida-dev-pentest-network
    driver: bridge

volumes:
  postgres_data:
    name: aida_dev_postgres_data
  aida_dev_frontend_modules:
    name: aida_dev_frontend_modules
