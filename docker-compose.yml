# =============================================================================
# AIDA — Docker Compose
# =============================================================================
# Started by `aida start` (or ./start.sh), which also creates backend/.env and
# the setup code. Images come from Docker Hub, so nothing is built locally.
#
#   https://<this machine>:31337   web UI (Caddy, self-signed certificate;
#                                  plain http:// on the same port redirects)
#   127.0.0.1:8000                 backend API, for the CLI / MCP on this host
#
# Contributors: `aida start --dev` adds docker-compose.dev.yml on top
# (source mounts, hot reload, Vite on http://localhost:5173).
# =============================================================================

name: aida

services:
  # Reverse proxy — the only service reachable from the network.
  caddy:
    image: caddy:2-alpine
    container_name: aida_caddy
    restart: unless-stopped
    environment:
      AIDA_PORT: ${AIDA_PORT:-31337}
    ports:
      # Same port inside and outside the container so http → https
      # redirects keep the port the browser used.
      - "${AIDA_BIND:-0.0.0.0}:${AIDA_PORT:-31337}:${AIDA_PORT:-31337}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the local certificate authority. Keep it: browsers and devices
      # that trusted it (`aida trust`) keep trusting AIDA across restarts.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aida-network
    depends_on:
      - frontend

  # Web UI — static React build served by Nginx, which also proxies /api,
  # /api/ws and /mcp to the backend. Only reachable through Caddy.
  frontend:
    image: vasco0x4/aida-frontend:${AIDA_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: aida_frontend
    restart: unless-stopped
    networks:
      - aida-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    image: vasco0x4/aida-backend:${AIDA_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aida_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: postgres
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Route docker CLI calls through the socket proxy instead of the raw
      # daemon socket. The proxy only allows inspect/exec/start.
      DOCKER_HOST: tcp://docker-proxy:2375
      # One-time code required to create the first admin account. start.sh
      # generates it; if empty, the backend makes one and prints it in its logs.
      AIDA_SETUP_CODE: ${AIDA_SETUP_CODE:-}
    ports:
      # Localhost only: the CLI and MCP server on this machine use it. Other
      # machines go through Caddy (https://<host>:31337/api, /mcp).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/logs:/app/logs:z
    networks:
      - aida-network
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: aida_postgres
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aida}
      POSTGRES_DB: ${POSTGRES_DB:-aida_assessments}
    # No host port: only the backend talks to the database, over the internal
    # network. (It used to be published on 5432 and clashed with local
    # Postgres installs.)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aida-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aida} -d ${POSTGRES_DB:-aida_assessments}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Docker socket proxy — exposes a filtered Docker API to the backend. Only
  # container inspection, exec and start are allowed; create/run/volumes/
  # images are blocked, so a compromised backend cannot escape to the host.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aida_docker_proxy
    restart: unless-stopped
    environment:
      POST: 1          # needed for exec & start
      CONTAINERS: 1    # inspect, list, start, stop
      EXEC: 1          # docker exec
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      BUILD: 0
      AUTH: 0
      SECRETS: 0
      PLUGINS: 0
      INFO: 0
      VERSION: 0
      EVENTS: 0
      DISTRIBUTION: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aida-network

  # Built-in pentesting toolbox. The backend runs the agent's commands in it
  # with `docker exec`. Skipped when Exegol is selected in Settings.
  aida-pentest:
    image: vasco0x4/aida-pentest:${AIDA_VERSION:-latest}
    build:
      context: ./pentest
      dockerfile: Dockerfile
    container_name: aida-pentest
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      # workspace_service.py discovers this path via docker inspect, so
      # aida.py can map assessment folders back to the host.
      - ${HOME}/.aida/workspaces:/workspace
    networks:
      - pentest-network

networks:
  aida-network:
    name: aida-network
    driver: bridge
  pentest-network:
    name: aida-pentest-network
    driver: bridge

volumes:
  postgres_data:
    name: aida_postgres_data
  caddy_data:
    name: aida_caddy_data
  caddy_config:
    name: aida_caddy_config
