server {
    # 8080 — the nginx-unprivileged image (Dockerfile.prod) runs as uid 101
    # and cannot bind <1024. Map to 80/443 at the edge (compose, k8s, Caddy).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the shell so a new release loads its matching chunks.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite names these files by content hash; they are safe to cache long-term.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — React Router handles all routes client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy — must come BEFORE /api (more specific match)
    location /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API proxy
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # MCP HTTP transport (Streamable HTTP — POST/GET/DELETE on /mcp)
    # Disabled in the backend by default (returns 503 until enabled in Settings).
    # Streaming requires HTTP/1.1 chunked transfer + buffering off.
    location /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
