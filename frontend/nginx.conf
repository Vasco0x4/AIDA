server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's DNS on every request instead of
    # once at startup: when the backend container is recreated (aida update)
    # it gets a new IP, and a cached one made the UI show "Backend not
    # reachable" until Nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $aida_backend http://backend:8000;

    # SPA fallback — React Router handles all routes client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy — must come BEFORE /api (more specific match)
    location /api/ws {
        proxy_pass $aida_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API proxy
    location /api {
        proxy_pass $aida_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # MCP HTTP transport (Streamable HTTP — POST/GET/DELETE on /mcp)
    # Disabled in the backend by default (returns 503 until enabled in Settings).
    # Streaming requires HTTP/1.1 chunked transfer + buffering off.
    location /mcp {
        proxy_pass $aida_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
