name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pentest/**'
      - 'agent/**'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  # The agent image bundles Claude Code: rebuild it weekly so `aida run`
  # downloads a recent one even when nothing changed here.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: vasco0x4/aida-backend
  FRONTEND_IMAGE: vasco0x4/aida-frontend
  PENTEST_IMAGE: vasco0x4/aida-pentest
  AGENT_IMAGE: vasco0x4/aida-agent

jobs:
  # ---------------------------------------------------------------------------
  # Determine which images need rebuilding (skip unchanged on push to main)
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pentest: ${{ steps.filter.outputs.pentest }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow rebuilds everything (e.g. new platforms).
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-publish.yml'
            pentest:
              - 'pentest/**'
              - '.github/workflows/docker-publish.yml'
            agent:
              - 'agent/**'
              - 'pentest/**'
              - '.github/workflows/docker-publish.yml'

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name == 'release' || needs.changes.outputs.backend == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # arm64 too: Apple Silicon Macs and ARM Linux then pull native images
          # instead of failing ("no matching manifest") and building locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Frontend (Nginx production build)
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name == 'release' || needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          # arm64 too: Apple Silicon Macs and ARM Linux then pull native images
          # instead of failing ("no matching manifest") and building locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Pentest container
  # ---------------------------------------------------------------------------
  pentest:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name == 'release' || needs.changes.outputs.pentest == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.PENTEST_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ./pentest
          file: ./pentest/Dockerfile
          # arm64 too: Apple Silicon Macs and ARM Linux then pull native images
          # instead of failing ("no matching manifest") and building locally.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Agent container (`aida run`): aida-pentest + Claude Code. Built FROM the
  # aida-pentest image of the same tag, so it waits for the pentest job and
  # shares its layers (`aida run` then downloads little more than Claude Code).
  # ---------------------------------------------------------------------------
  agent:
    runs-on: ubuntu-latest
    needs: [changes, pentest]
    # Releases, the weekly rebuild, a manual run on the default branch, or a
    # push that touched agent/, pentest/ or this workflow.
    if: >-
      always()
      && (needs.pentest.result == 'success' || needs.pentest.result == 'skipped')
      && (github.event_name == 'release'
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
      || needs.changes.outputs.agent == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Pin the Claude Code version: the layer cache is reused until a new
      # release is out, and the weekly run picks it up.
      - name: Latest Claude Code version
        id: claude
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.PENTEST_IMAGE }}:${{ steps.meta.outputs.version }}
            CLAUDE_CODE_VERSION=${{ steps.claude.outputs.version }}
          # arm64 too: Apple Silicon Macs and ARM Linux then pull native images
          # instead of failing ("no matching manifest") and building locally.
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
