name: Backend tests

# pytest: MCP auth rules for API keys, per-key MCP client contexts (agents
# on different assessments side by side), and the host helper's /launch.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tools/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aida
          POSTGRES_PASSWORD: aida
          POSTGRES_DB: aida_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aida -d aida_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIDA_TEST_DATABASE_URL: postgresql://aida:aida@127.0.0.1:5432/aida_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same as backend/Dockerfile
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Host helper tests
        run: python -m pytest -v tools/tests
