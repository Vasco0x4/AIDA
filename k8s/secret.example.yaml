# Template for the AIDA secret — copy to k8s/secret.yaml and fill in real
# values. secret.yaml is gitignored; NEVER commit real credentials.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#
# Generate SECRET_KEY:  openssl rand -hex 32
# Generate POSTGRES_PASSWORD:  openssl rand -hex 16
#
# For a real cluster prefer sealed-secrets / external-secrets / `kubectl create
# secret` over manifest files — this template exists so `kubectl apply -k` is
# self-contained for eval environments.
apiVersion: v1
kind: Secret
metadata:
  name: aida-secrets
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_openssl_rand_hex_32"
  POSTGRES_PASSWORD: "CHANGE_ME_openssl_rand_hex_16"
